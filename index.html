<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev tutorial</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/logo.jpeg">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <marquee behavior="alternate" class="box" direction="down">
            <div class="ball"></div>
        </marquee>
    </marquee>

    <h2>Forms</h2>
    <form action="" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <div>
                <label for="firstname">Firstname:</label>
                <input type="text" placeholder="Firstname" name="firstname" id="firstname" required/>
            </div>
            <div>
                <label for="lastname">Lastname:</label>
                <input type="text" placeholder="Lastname" name="lastname" id="lastname" required/>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" placeholder="Email Address" name="email" id="email" required/>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" placeholder="Password" name="password" id="password" required/>
            </div>
            <div>
                <label for="dob">Date of Birth:</label>
                <input type="date" name="dob" id="dob" required/>
            </div>
            <div>
                <p>Gender:</p>
                <label for="male">Male:</label>
                <input type="radio" name="gender" id="male" value="male" required/>
                <label for="female">Female:</label>
                <input type="radio" name="gender" id="female" value="female" required/>
            </div>
        </fieldset>

        <fieldset>
            <legend>Recreational Information</legend>
            <div>
                <label for="color">Best Color:</label>
                <input type="color" placeholder="Best Color" name="color" id="color"/>
            </div>
            <div>
                <p>Hobbies:</p>
                <label for="reading">Reading:</label>
                <input type="checkbox" name="hobbies" id="reading"/>
                <label for="swimming">Swimming:</label>
                <input type="checkbox" name="hobbies" id="swimming"/>
                <label for="dancing">Dancing:</label>
                <input type="checkbox" name="hobbies" id="dancing"/>
                <label for="singing">Singing:</label>
                <input type="checkbox" name="hobbies" id="singing"/>
                <label for="fighting">Fighting:</label>
                <input type="checkbox" name="hobbies" id="fighting"/>
                <label for="drawing">Drawing:</label>
                <input type="checkbox" name="hobbies" id="drawing"/>
            </div>
            
        </fieldset>

        <fieldset>
            <legend>About Information</legend>
            <div>
                <label for="state">State of Origin:</label>
                <select name="state" id="state">
                    <option value="">Select State</option>
                    <option value="lagos">Lagos</option>
                    <option value="ogun">Ogun</option>
                    <option value="oyo">Oyo</option>
                    <option value="ondo">Ondo</option>
                </select>
            </div>
            <div>
                <label for="bio">Biography:</label><br />
                <textarea name="bio" id="bio" cols="30" rows="10" placeholder="Biography">This is my Biography</textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>Action</legend>
            <div>
                <input type="reset" value="Reset"/>
                <input type="submit" value="Submit"/>
            </div>
            
        </fieldset>
        
    </form>


    <h2>Layouts</h2>
    <h5>Floats</h5>
    <div>
        <p>This is the main content</p>
        <p class="float">Floated</p>
        <p>Something else</p>
    </div>

    <h5>Flexbox</h5>
    <div>
        <div class="flex-container">
            <div class="flex-box">1</div>
            <div class="flex-box">2</div>
            <div class="flex-box">3</div>
            <div class="flex-box">4</div>
            <div class="flex-box">5</div>
            <div class="flex-box">6</div>
            <div class="flex-box">7</div>
        </div>
    </div>

    <h5>Grid layout</h5>
    <div>
        <div class="grid-container">
            <div class="grid-box">1</div>
            <div class="grid-box">2</div>
            <div class="grid-box">3</div>
            <div class="grid-box">4</div>
            <div class="grid-box">5</div>
            <div class="grid-box">6</div>
            <div class="grid-box">7</div>
        </div>
    </div>

    <h5>Positioning and Stacking Context</h5>
    <div>
        <div class="position-container">
            <div class="position-right">1</div>
            <div class="position-left">2</div>
            <div class="position-bottom">3</div>
            <div class="position-bottom-right">4</div>
            <div class="position-center">5</div>
            
            <!-- <div class="position-box">7</div> -->
        </div>
    </div>
    <div class="sticky-container">
        <div class="position-sticky">6</div>
    </div>

    <button onmouseover="bgChange('violet')" onmouseleave="bgChange('cyan')" >Hover on Me</button>

    <button id="bgWhite">Change BG back to white - Click on me</button>

    <button onclick="changeMedia()">Click Me</button>

    <h5 id="media">Media Query</h5>
    <div class="stuff">Woking</div>

    <a href="./userApplication.html"><button>Go to User Application</button></a>



    <script src="./js/scripts.js"></script>
</body>
</html>
